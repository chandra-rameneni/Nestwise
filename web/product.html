<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product · Nestwise</title>
<link rel="stylesheet" href="/static/styles.css?v=9">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="logo" href="/" aria-label="Nestwise home">Nest<span>wise</span></a>
    <form class="search" action="/" role="search">
      <input name="q" type="search" placeholder="Search products" aria-label="Search products">
    </form>
    <nav class="nav-links">
      <a href="/#shop" class="hide-sm">Shop</a>
      <a href="/inspector" class="hide-sm">Inspector</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main"><p class="typing" style="padding:40px 0">Loading product…</p></main>

<footer class="foot">
  <div class="wrap">
    <p class="brandline">Nest<span>wise</span></p>
    <p>Products from the Flipkart Products dataset (PromptCloud, CC BY-SA 4.0). Prices are historical (2015–16). Stock and delivery are simulated. Orders are demo orders: no payment is taken and nothing ships.</p>
  </div>
</footer>

<aside class="dock" id="dock" aria-label="Product assistant"></aside>
<button class="btn primary dock-fab" id="ig-fab" type="button" aria-expanded="false" aria-controls="dock">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
  Ask about this
</button>

<script src="/static/agent.js?v=11"></script>
<script>
(function () {
  const { inr, esc } = window.IGAgent;
  const pid = decodeURIComponent(location.pathname.split("/").pop());
  const READY = ["How wide is it?", "When will it arrive?", "Buy this"];

  function render(p) {
    document.title = `${p.title} · Nestwise`;
    const off = p.mrp_inr && p.price_inr && p.mrp_inr > p.price_inr ? Math.round((1 - p.price_inr / p.mrp_inr) * 100) : 0;
    const initials = esc((p.brand || p.title).slice(0, 2).toUpperCase());
    const notes = Object.entries(p.data_notes || {}).map(([k, v]) =>
      `<div class="note"><strong>Check this value:</strong> ${esc(k.replace("_cm", "").replace("_", " "))}: the ${esc(v)}. The assistant treats it as unknown.</div>`).join("");
    const specs = Object.entries(p.specs || {}).filter(([, v]) => v && v !== "NA");
    document.getElementById("main").innerHTML = `
      <div class="crumbs"><a href="/">Home</a> › <a href="/?category=${esc(p.category)}">${esc(p.category_label)}</a> › ${esc(p.category_path.split(" > ").slice(1).join(" › "))}</div>
      <div class="pdp">
        <div class="img">${p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.title)}" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${initials}'}))">` : `<span class="ph">${initials}</span>`}</div>
        <div class="info">
          <span class="brand">${esc(p.brand || "Brand not listed")}</span>
          <h1>${esc(p.title)}</h1>
          <div class="price"><span class="now">${inr(p.price_inr)}</span>${off ? `<span class="was">${inr(p.mrp_inr)}</span><span class="off">${off}% off</span>` : ""}</div>
          <div class="deliv">${p.stock > 0 ? `Delivery ${p.shipping_inr ? inr(p.shipping_inr) : "free"} · arrives in ${esc(p.delivery_days)} days` : `<span class="oos">Out of stock</span>`}</div>
          <div class="chips">
            <span class="chip">Historical price (2015–16)${(p.source_flags.price || "").includes("simulation") ? " · changed by demo" : ""}</span>
            <span class="chip sim">${p.stock > 0 ? `${esc(p.stock)} in stock · ` : ""}stock and delivery simulated</span>
            ${p.returnable === false ? `<span class="chip warn" title="Store policy P3: small no-return item. If it arrives broken, it's replaced after a review.">No returns</span>` : ""}
          </div>
          ${notes}
          <div class="askbox">
            <h2>Ask about this product.</h2>
            <p>Answers come only from this listing. If it doesn't say, you'll be told.</p>
            <div class="qs">${READY.map((q) => `<button class="pill" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
            <form class="ask" id="pdp-ask">
              <label for="pdp-input" class="sr-only">Your question</label>
              <input id="pdp-input" autocomplete="off" maxlength="1000" placeholder="Is it easy to clean?">
              <button class="btn primary" type="submit">Ask</button>
            </form>
          </div>
        </div>
      </div>
      <div class="section"><h2>Specifications.</h2>
        ${specs.length ? `<div style="overflow-x:auto"><table class="specs"><tbody>${specs.map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="desc">The listing has no specifications.</p>`}
      </div>
      <div class="section"><h2>Description.</h2><p class="desc">${esc(p.description) || "No description in the listing."}</p></div>
      <div class="section desc" style="font-size:13px;margin-bottom:40px">Product ID <code>${esc(p.product_id)}</code> · <a href="${esc(p.source_url)}" target="_blank" rel="noopener">Original 2016 listing</a> (may no longer exist)</div>`;
  }

  fetch("/api/products/" + encodeURIComponent(pid)).then(async (r) => {
    if (!r.ok) { document.getElementById("main").innerHTML = `<div class="empty" style="margin:40px 0">This product isn't in the store. <a href="/">Back to all products</a></div>`; return; }
    render(await r.json());
  });
  document.addEventListener("ig:product-changed", (e) => { if (e.detail && e.detail.product_id === pid) render(e.detail); });

  const ig = IGAgent.mount({
    el: document.getElementById("dock"),
    context: { page: "product", product_id: pid },
    title: "Ask about this product",
    intro: "I answer from this product's listing only, and say so when it doesn't cover something. Say “buy this” to order; I'll ask you to approve the exact total first.",
    suggestions: ["How wide is it?", "What is it made of?", "Will it fit a 2 m wall?", "Show me cheaper ones like this", "Buy this"],
  });
  document.getElementById("main").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-q]"); if (b) ig.send(b.dataset.q);
  });
  document.getElementById("main").addEventListener("submit", (e) => {
    if (e.target.id !== "pdp-ask") return;
    e.preventDefault();
    const input = document.getElementById("pdp-input");
    if (!input.value.trim()) { ig.open(); return; }
    ig.send(input.value); input.value = "";
  });
})();
</script>
</body>
</html>
